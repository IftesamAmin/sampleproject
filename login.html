<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Password Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container text-center mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h3 class="mb-0">Login</h3>
            </div>
            <div class="card-body">
              <form>
                <div class="mb-3 text-start">
                  <label for="username" class="form-label"
                    >Username or Email Ok
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="Enter username or email"
                    required
                  />
                </div>
                <div class="mb-3 text-start">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter password"
                    required
                  />
                </div>
                <div class="mb-3 form-check text-start">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="rememberMe"
                  />
                  <label class="form-check-label" for="rememberMe"
                    >Remember me</label
                  >
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                  Login
                </button>

                <div class="text-center mb-3">
                  <a href="#" class="text-decoration-none">Forgot password?</a>
                </div>

                <hr />

                <p class="text-muted">
                  Don't have an account?
                  <a href="#" class="text-decoration-none">Sign up here</a>
                </p>
              </form>
            </div>
            <div class="card-footer text-muted">
              <small>Secure login form</small>
            </div>
          </div>

          <div class="mt-4">
            <h5>Navigation</h5>
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <a href="/home.html" class="btn btn-outline-primary btn-sm"
                >Home</a
              >
              <a
                href="{% url 'about' %}"
                class="btn btn-outline-secondary btn-sm"
                >About</a
              >
              <a
                href="{% url 'contact' %}"
                class="btn btn-outline-success btn-sm"
                >Contact</a
              >
              <a href="{% url 'users' %}" class="btn btn-outline-info btn-sm"
                >Users</a
              >
              <a href="{% url 'api' %}" class="btn btn-outline-warning btn-sm"
                >API</a
              >
              <a
                href="{% url 'password' %}"
                class="btn btn-outline-danger btn-sm"
                >Password</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
